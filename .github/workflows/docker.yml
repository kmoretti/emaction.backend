name: Docker

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      image_tag:
        description: 'Existing GHCR image tag to deploy'
        required: true
        type: string
      deploy:
        description: 'Deploy the selected image to the server over SSH'
        required: true
        default: false
        type: boolean

permissions:
  contents: read
  packages: write

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    env:
      IMAGE_NAME: ghcr.io/kmoretti/emaction-backend
    steps:
      - name: Check out
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22.x'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Test
        env:
          REQUIRE_SQLITE_TESTS: '1'
        run: npm test

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Compute image tags
        id: meta
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          INPUT_IMAGE_TAG: ${{ inputs.image_tag }}
          INPUT_DEPLOY: ${{ inputs.deploy }}
          REF_NAME: ${{ github.ref_name }}
          ENABLE_SSH_DEPLOY: ${{ vars.ENABLE_SSH_DEPLOY }}
        run: |
          if [[ "$EVENT_NAME" == "workflow_dispatch" ]]; then
            if [[ -z "$INPUT_IMAGE_TAG" || "$INPUT_IMAGE_TAG" == "latest" ]]; then
              echo 'workflow_dispatch requires an immutable image_tag (not latest)'
              exit 1
            fi
            echo "tag=$INPUT_IMAGE_TAG" >> "$GITHUB_OUTPUT"
            echo "build=false" >> "$GITHUB_OUTPUT"
            echo "deploy=$INPUT_DEPLOY" >> "$GITHUB_OUTPUT"
          else
            if [[ "$REF_NAME" == "latest" ]]; then
              echo 'latest is not a valid production tag'
              exit 1
            fi
            echo "tag=$REF_NAME" >> "$GITHUB_OUTPUT"
            echo "build=true" >> "$GITHUB_OUTPUT"
            if [[ "$ENABLE_SSH_DEPLOY" == 'true' ]]; then
              echo 'deploy=true' >> "$GITHUB_OUTPUT"
            else
              echo 'deploy=false' >> "$GITHUB_OUTPUT"
            fi
          fi

      - name: Build and push image
        if: steps.meta.outputs.build == 'true'
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64
          push: true
          tags: |
            ${{ env.IMAGE_NAME }}:${{ steps.meta.outputs.tag }}
            ${{ env.IMAGE_NAME }}:sha-${{ github.sha }}
          labels: |
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.version=${{ steps.meta.outputs.tag }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Deploy selected image over SSH
        if: steps.meta.outputs.deploy == 'true'
        uses: appleboy/ssh-action@v1.2.0
        env:
          DEPLOY_IMAGE_TAG: ${{ steps.meta.outputs.tag }}
          GHCR_USERNAME: ${{ secrets.GHCR_USERNAME }}
          GHCR_TOKEN: ${{ secrets.GHCR_TOKEN }}
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: ${{ secrets.DEPLOY_USER }}
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          port: ${{ secrets.DEPLOY_PORT || 22 }}
          envs: DEPLOY_IMAGE_TAG,GHCR_USERNAME,GHCR_TOKEN
          script: |
            set -eu
            test -n "${GHCR_USERNAME:-}" && test -n "${GHCR_TOKEN:-}"
            echo "$GHCR_TOKEN" | docker login ghcr.io --username "$GHCR_USERNAME" --password-stdin
            cd /opt/emaction-backend
            export IMAGE_TAG="$DEPLOY_IMAGE_TAG"
            docker compose pull api
            docker compose up -d api
            for i in $(seq 1 30); do
              if curl --fail --silent http://127.0.0.1:18080/health >/tmp/emaction-health.json; then
                cat /tmp/emaction-health.json
                exit 0
              fi
              sleep 2
            done
            docker compose logs --tail=100 api
            exit 1
